<!doctype html>
<html lang="en" data-scheme="dark" data-amoled="true" data-style="minimal" data-navstyle="minimal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Evolve</title>
  <meta name="description" content="Evolve: a private personal life-management app for tasks, habits, finance, fitness, study and your library.">
  <meta name="application-name" content="Evolve">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Evolve">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Evolve">
  <meta property="og:description" content="A private personal life-management app.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/logo/mark.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-180.png">

  <!-- Apply the saved theme before first paint so there is no flash -->
  <script>
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('evolve_v7_workspace') || localStorage.getItem('evolve_personal_os_v1') || '{}').settings) || {};
        var r = document.documentElement, theme = s.theme || 'dark';
        var scheme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        r.dataset.scheme = scheme; r.dataset.amoled = String(s.amoled !== false && scheme === 'dark');
        if (['minimal', 'glass', 'cinematic', 'classic'].indexOf(s.style) > -1) r.dataset.style = s.style;
        if (['minimal', 'cinematic', 'glass', 'casual'].indexOf(s.navStyle) > -1) r.dataset.navstyle = s.navStyle;
      } catch (e) { /* defaults apply */ }
    })();
  </script>
  <style>
    /* splash: critical CSS, shown until the app has drawn its first screen */
    #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #000; color: #fff; transition: opacity .4s ease, visibility .4s; }
    [data-scheme="light"] #splash { background: #fff; color: #0e0e12; }
    #splash.is-out { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .sp-in { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: sp-rise .7s cubic-bezier(.22,1,.36,1) both; }
    #splash b { font: 650 1.05rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
    @keyframes sp-rise { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash .sp-in { animation: none; } }
  </style>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/modules/home.css">
  <link rel="stylesheet" href="css/modules/habits.css">
  <link rel="stylesheet" href="css/modules/academics.css">
  <link rel="stylesheet" href="css/modules/finance.css">
  <link rel="stylesheet" href="css/modules/fitness.css">
  <link rel="stylesheet" href="css/modules/gaming.css">
  <link rel="stylesheet" href="css/modules/discipline.css">
  <link rel="stylesheet" href="css/modules/planner.css">
  <link rel="stylesheet" href="css/modules/library.css">
  <link rel="stylesheet" href="css/modules/more.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="sp-in">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15v34M19 32h19M19 49h11"/><path d="M19 15h27" stroke="#0A84FF"/></svg>
    <b>Evolve</b></div></div>
  <a class="sr-only" href="#view">Skip to content</a>
  <div class="app" id="app" data-sidebar="expanded">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>

    <div class="shell">
      <header class="topbar" id="topbar">
        <div class="topbar-start">
          <button class="icon-btn back-btn" id="backBtn" type="button" data-action="back" aria-label="Back" hidden></button>
          <span class="topbar-brand" id="topMark"></span>
          <span class="topbar-title" id="topbarTitle"></span>
        </div>
        <div class="topbar-end">
          <button class="search-pill" type="button" data-action="search" aria-label="Search">
            <span id="searchPillIcon"></span><span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <div class="tb-cluster" role="group" aria-label="Quick actions">
            <button class="tb-btn tb-search" id="searchIcon" type="button" data-action="search" aria-label="Search"></button>
            <button class="tb-btn tb-add" id="addIcon" type="button" data-action="quick-add" aria-label="Quick add"></button>
            <button class="tb-btn" id="moreBtn" type="button" data-action="more" aria-haspopup="menu" aria-expanded="false" aria-label="More"></button>
          </div>
          <button class="btn btn-primary btn-sm add-pill" id="addPill" type="button" data-action="quick-add"></button>
        </div>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">Evolve needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/cloud/boot.js"></script>
</body>
</html>
